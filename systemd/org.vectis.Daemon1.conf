<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Without this file, request_name("org.vectis.Daemon1") in main.rs
       fails outright - the system bus denies owning arbitrary names by
       default, this is not optional boilerplate. -->
  <policy user="root">
    <allow own="org.vectis.Daemon1"/>
  </policy>

  <!-- Any user can call methods on the daemon; actual authorization for
       the mutating ones (apply_profile/set_tdp/set_gpu_mode) is enforced
       by polkit inside the daemon itself (see polkit.rs +
       policy/org.vectis.policy), not here. Read-only methods
       (get_status/list_gpu_devices/get_conflicts) are intentionally
       open to everyone. -->
  <policy context="default">
    <allow send_destination="org.vectis.Daemon1"/>
    <allow receive_sender="org.vectis.Daemon1"/>
  </policy>
</busconfig>
